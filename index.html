<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo — Safe Space & Friends Voice Hangout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans Myanmar', 'sans-serif'],
          },
          colors: {
            memo: {
              bg: '#0D0E12',
              card: '#161821',
              card2: '#1E212D',
              border: '#282C3C',
              accent: '#FF6B2B',
              accent2: '#FF944D',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0D0E12;
      color: #F3F4F6;
      font-family: 'Inter', 'Noto Sans Myanmar', sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #161821; }
    ::-webkit-scrollbar-thumb { background: #2D3246; border-radius: 999px; }

<body class="min-h-screen pb-24 bg-[#0D0E12] text-gray-100">

  <!-- ENTRY GATE MODAL (USERNAME & FRIEND PASSCODE) -->
  <div id="gate-modal" class="fixed inset-0 z-50 bg-[#0D0E12]/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#161821] border border-[#282C3C] rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-[#282C3C] pb-3.5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#FF6B2B] to-[#FF944D] flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-[#FF6B2B]/20">
            M
          </div>
          <div>
            <h1 class="text-xl font-extrabold bg-gradient-to-r from-[#FF6B2B] to-[#FF944D] bg-clip-text text-transparent">
              Memo Hangout
            </h1>
            <p class="text-[11px] text-gray-400">Private Friends Space • Feed, Chat & Voice</p>
          </div>
        </div>
        <span class="text-[11px] px-2.5 py-1 rounded-full bg-[#FF6B2B]/15 border border-[#FF6B2B]/30 text-[#FF944D] font-semibold">
          Friends Only
        </span>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Display Name (ပြသမည့် နာမည်)</label>
          <input id="gate-name" type="text" placeholder="ဥပမာ - Gogogo"
            class="w-full bg-[#1E212D] border border-[#282C3C] focus:border-[#FF6B2B] rounded-xl px-3.5 py-2.5 text-sm text-white outline-none transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Username (@username)</label>
          <input id="gate-handle" type="text" placeholder="ဥပမာ - gogogo1027"
            class="w-full bg-[#1E212D] border border-[#282C3C] focus:border-[#FF6B2B] rounded-xl px-3.5 py-2.5 text-sm text-white outline-none transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Friend Passcode (သူငယ်ချင်း စကားဝှက်)</label>
          <input id="gate-passcode" type="password" placeholder="Default: memo1027"
            class="w-full bg-[#1E212D] border border-[#282C3C] focus:border-[#FF6B2B] rounded-xl px-3.5 py-2.5 text-sm text-white outline-none transition" />
          <p class="text-[11px] text-gray-500 mt-1">Code ထဲက <code class="text-[#FF944D]">FRIEND_PASSCODE</code> ကို ကိုယ်ကြိုက်တဲ့ စကားဝှက် ပြောင်းနိုင်ပါသည်။</p>
        </div>
      </div>

      <div id="gate-error" class="hidden text-xs bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl px-3 py-2"></div>

      <button id="btn-gate-enter"
        class="w-full py-3 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-[#FF6B2B] to-[#FF944D] hover:opacity-95 active:scale-[0.99] transition shadow-lg shadow-[#FF6B2B]/25">
        အတည်ပြုပြီး Memo ထဲ ဝင်မည်
      </button>
    </div>
  </div>

    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
