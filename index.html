<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo - Live Social & Chat</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #15171e;
      --card-2: #1d202a;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #ff6b2b;
      --accent-2: #ff944d;
      --border: #272b38;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 84px; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(11,12,16,0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status-pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border); color: var(--ok); }
    .container { max-width: 640px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    textarea, input {
      width: 100%; background: var(--card-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px;
      font-size: 14px; outline: none;
    }
    textarea:focus, input:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 76px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none; border-radius: 12px; padding: 10px 16px;
      font-weight: 700; font-size: 14px; cursor: pointer;
    }
    button.secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    button.small { padding: 6px 12px; font-size: 12px; border-radius: 9px; }
    .post { display: flex; flex-direction: column; gap: 8px; }
    .post-head { display: flex; justify-content: space-between; align-items: center; }
    .author { font-weight: 700; font-size: 14px; }
    .handle { color: var(--accent-2); font-size: 12px; }
    .time { color: var(--muted); font-size: 11px; }
    .post-body { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .post-actions { display: flex; gap: 10px; margin-top: 4px; }
    .chat-box { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px 0; }
    .msg { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
    .msg.mine { background: rgba(255, 107, 43, 0.16); border-color: rgba(255, 107, 43, 0.45); margin-left: 24px; }
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(15,17,23,0.95); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 6px;
    }
    .nav button { background: transparent; color: var(--muted); border-radius: 10px; padding: 8px; font-size: 13px; }
    .nav button.active { background: var(--card-2); color: var(--accent-2); }
    .hidden { display: none; }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Memo</div>
    <div id="conn-status" class="status-pill">Connecting...</div>
  </header>

  <main class="container">
    <section id="tab-feed">
      <div class="card">
        <label class="label">အခု ဘာတွေးနေလဲ / Post တင်မယ်</label>
        <textarea id="post-input" placeholder="သူငယ်ချင်းတွေ မြင်ရအောင် Post တစ်ခု ရေးလိုက်ပါ..."></textarea>
        <div class="row" style="justify-content: space-between;">
          <span id="posting-as" class="handle"></span>
          <button id="btn-post">Post တင်မည်</button>
        </div>
      </div>
      <div id="feed-list" style="display:flex; flex-direction:column; gap:12px; margin-top:12px;"></div>
    </section>

    <section id="tab-chat" class="hidden">
      <div class="card">
        <div style="font-weight:700; margin-bottom:8px;">Global Lounge Chat (အားလုံး စကားပြောခန်း)</div>
        <div id="chat-list" class="chat-box"></div>
        <div class="row">
          <input id="chat-input" type="text" placeholder="စာတစ်စောင် ရိုက်ထည့်ပါ..." />
          <button id="btn-send-chat">ပို့မည်</button>
        </div>
      </div>
    </section>

    <section id="tab-profile" class="hidden">
      <div class="card" style="display:flex; flex-direction:column; gap:10px;">
        <div style="font-weight:700; font-size:16px;">Profile Settings</div>
        <div>
          <label class="label">Display Name</label>
          <input id="prof-name" type="text" placeholder="နာမည်" />
        </div>
        <div>
          <label class="label">@Username</label>
          <input id="prof-handle" type="text" placeholder="username" />
        </div>
        <div>
          <label class="label">Bio</label>
          <textarea id="prof-bio" placeholder="ကိုယ့်အကြောင်း အကျဉ်းချုပ်..."></textarea>
        </div>
        <button id="btn-save-profile">Profile သိမ်းမည်</button>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button id="nav-feed" class="active">Feed</button>
    <button id="nav-chat">Chat</button>
    <button id="nav-profile">Profile</button>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhEf2wFnYhAhf2YYYELl6ffM72kGaRUH0",
      authDomain: "memo-app-1c08a.firebaseapp.com",
      databaseURL: "https://memo-app-1c08a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "memo-app-1c08a",
      storageBucket: "memo-app-1c08a.firebasestorage.app",
      messagingSenderId: "1012608684376",
      appId: "1:1012608684376:web:15f4eeea82a6dfbd36552d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let uid = localStorage.getItem("memo_uid");
    if (!uid) {
      uid = "u_" + Math.random().toString(36).slice(2, 9);
      localStorage.setItem("memo_uid", uid);
    }

    let profile = JSON.parse(localStorage.getItem("memo_profile") || "null") || {
      name: "Gogogo",
      handle: "gogogo1027",
      bio: "Memo member"
    };

    const statusEl = document.getElementById("conn-status");
    const postingAsEl = document.getElementById("posting-as");
    const profNameEl = document.getElementById("prof-name");
    const profHandleEl = document.getElementById("prof-handle");
    const profBioEl = document.getElementById("prof-bio");

    function syncProfileUI() {
      postingAsEl.textContent = `${profile.name} (@${profile.handle})`;
      profNameEl.value = profile.name;
      profHandleEl.value = profile.handle;
      profBioEl.value = profile.bio;
      localStorage.setItem("memo_profile", JSON.stringify(profile));
      set(ref(db, `users/${uid}`), { ...profile, updatedAt: Date.now() }).catch(() => {});
    }
    syncProfileUI();

    onValue(ref(db, ".info/connected"), (snap) => {
      if (snap.val() === true) {
        statusEl.textContent = "Live Connected";
        statusEl.style.color = "#22c55e";
      } else {
        statusEl.textContent = "Offline / Retrying";
        statusEl.style.color = "#f59e0b";
      }
    });

    const tabs = {
      feed: { el: document.getElementById("tab-feed"), btn: document.getElementById("nav-feed") },
      chat: { el: document.getElementById("tab-chat"), btn: document.getElementById("nav-chat") },
      profile: { el: document.getElementById("tab-profile"), btn: document.getElementById("nav-profile") }
    };
    function switchTab(name) {
      Object.entries(tabs).forEach(([k, v]) => {
        v.el.classList.toggle("hidden", k !== name);
        v.btn.classList.toggle("active", k === name);
      });
    }
    tabs.feed.btn.onclick = () => switchTab("feed");
    tabs.chat.btn.onclick = () => switchTab("chat");
    tabs.profile.btn.onclick = () => switchTab("profile");

    document.getElementById("btn-save-profile").onclick = () => {
      profile = {
        name: (profNameEl.value.trim() || "Memo User"),
        handle: (profHandleEl.value.trim().replace(/^@+/, "") || "user"),
        bio: profBioEl.value.trim()
      };
      syncProfileUI();
      alert("Profile သိမ်းပြီးပါပြီ!");
    };

    document.getElementById("btn-post").onclick = async () => {
      const input = document.getElementById("post-input");
      const text = input.value.trim();
      if (!text) return;
      await push(ref(db, "posts"), {
        uid,
        name: profile.name,
        handle: profile.handle,
        text,
        likes: 0,
        createdAt: Date.now()
      });
      input.value = "";
    };

    const feedList = document.getElementById("feed-list");
    onValue(ref(db, "posts"), (snap) => {
      const val = snap.val() || {};
      const items = Object.entries(val)
        .map(([id, p]) => ({ id, ...p }))
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      feedList.innerHTML = items.map(p => `
        <div class="card post">
          <div class="post-head">
            <div>
              <span class="author">${escapeHtml(p.name || "User")}</span>
              <span class="handle">@${escapeHtml(p.handle || "member")}</span>
            </div>
            <span class="time">${formatTime(p.createdAt)}</span>
          </div>
          <div class="post-body">${escapeHtml(p.text || "")}</div>
          <div class="post-actions">
            <button class="secondary small" onclick="window.likePost('${p.id}', ${p.likes || 0})">♥ ${p.likes || 0}</button>
          </div>
        </div>
      `).join("") || `<div class="card" style="color:var(--muted); text-align:center;">Post များ မရှိသေးပါ။ ပထမဆုံး Post တစ်ခု တင်လိုက်ပါ!</div>`;
    });

    window.likePost = (id, currentLikes) => {
      update(ref(db, `posts/${id}`), { likes: (currentLikes || 0) + 1 }).catch(() => {});
    };

      const text = input.value.trim();
